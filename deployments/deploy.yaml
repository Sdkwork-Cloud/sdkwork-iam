version: 2
defaultProfile: cloud.production

profiles:
  cloud.test:
    deployment:
      deploymentProfile: cloud
      environment: test
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: multi-tenant
      isolationModel: shared
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: iam-test.sdkwork.com
        tls: sdkwork.com
        mode: api
        web: adaptive
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: cloud.test
        env: etc/topology/cloud.test.env
      kubernetes:
        reference: deployments/kubernetes/

  cloud.staging:
    deployment:
      deploymentProfile: cloud
      environment: staging
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: multi-tenant
      isolationModel: shared
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: iam-staging.sdkwork.com
        tls: sdkwork.com
        mode: api
        web: adaptive
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: cloud.staging
        env: etc/topology/cloud.staging.env
      kubernetes:
        reference: deployments/kubernetes/

  cloud.production:
    deployment:
      deploymentProfile: cloud
      environment: production
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: multi-tenant
      isolationModel: shared
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: iam.sdkwork.com
        tls: sdkwork.com
        mode: api
        web: adaptive
    packages:
      - id: sdkwork-api-iam-assembly
        kind: rust-binary
        crate: sdkwork-api-iam-assembly
        healthPath: /healthz
        readinessPath: /readyz
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: cloud.production
        env: etc/topology/cloud.production.env
      kubernetes:
        reference: deployments/kubernetes/
      proxy:
        upstreams:
          application: http://127.0.0.1:8080

  standalone.production:
    deployment:
      deploymentProfile: standalone
      environment: production
      deliveryKind: host-package
      deploymentDriver: nginx
      managementModel: customer-managed
      tenancyModel: single-tenant
      isolationModel: dedicated
      networkExposure: private
      rolloutStrategy: recreate
      availabilityMode: single-instance
    install:
      layout: binary-package
    expose:
      - domain: iam.internal.example
        tls: managed
        mode: api
        web: adaptive
        apiPathStyle: full-prefix
    packages:
      - id: sdkwork-api-iam-assembly
        kind: rust-binary
        crate: sdkwork-api-iam-assembly
        healthPath: /healthz
        readinessPath: /readyz
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: standalone.production
        env: etc/topology/standalone.production.env
      proxy:
        upstreams:
          application.public-ingress: http://127.0.0.1:3901
          platform.api-gateway: http://127.0.0.1:3900
      nginx:
        clientMaxBodySize: 32m
